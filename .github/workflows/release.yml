name: Build and publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: game-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl --fail --location "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Choose next published version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^config\/version="\([0-9.]*\)".*/\1/p' project.godot | head -n 1)"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]]; then
            version="$(python3 scripts/next_release_version.py "$source_version" "${latest_tag#v}")"
          else
            version="$source_version"
          fi
          python3 scripts/prepare_release.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require the same Android signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Add ANDROID_DEBUG_KEYSTORE_BASE64 as a repository Actions secret to publish APK updates." >&2
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project resources
        run: godot --headless --editor --path . --quit --import

      - name: Export Windows, Android and Web builds
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          python3 scripts/stamp_web_version.py build/web "$RELEASE_VERSION"
          godot --headless --path . --export-release "Windows Desktop" build/NotebookArena.exe
          godot --headless --path . --export-debug "Android APK" build/NotebookArena.apk
          (cd build && zip -qr NotebookArena-web.zip web)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web export to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy Web export to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          title="Notebook Arena $RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              build/NotebookArena.exe build/NotebookArena.apk build/NotebookArena-web.zip \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$title" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              build/NotebookArena.exe build/NotebookArena.apk build/NotebookArena-web.zip \
              --target "$GITHUB_SHA" --title "$title" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
